# Páginas do Jayme (LP, /linktree, /black, /planilhas, /biblioteca) — Easypanel, serviço Docker Compose.
#
# A página entra na rede do Supabase (serviço `supabase` do projeto portal_atletas)
# para alcançar o Postgres dele (`db`, banco `postgres`): os leads aparecem no Studio,
# no schema `paginas`. A migração tem nome próprio (`paginas-migracao`) para não
# colidir com os serviços que já existem naquela rede.

x-banco: &banco
  # Só chega ao container o que está listado aqui — variável criada no Easypanel
  # e esquecida nesta lista é ignorada em silêncio.
  DATABASE_USER: ${DATABASE_USER:-postgres}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
  DATABASE_HOST: ${DATABASE_HOST:-db}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_NAME: ${DATABASE_NAME:-postgres}
  DATABASE_SCHEMA: ${DATABASE_SCHEMA:-paginas}
  DATABASE_SSL: ${DATABASE_SSL:-false}

services:
  # Cria/atualiza o schema `paginas` (Alembic) e sai. A página só sobe se der certo.
  paginas-migracao:
    build:
      context: ./db
    restart: "no"
    environment: *banco
    networks:
      - supabase

  lp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # domínio final da LP (com https). Troque aqui ou defina no Easypanel.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://seu-dominio.com.br}
        # Meta Pixel (o ID é público). Trocou o Pixel? Mude e reimplante.
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-1104861572184949}
    restart: unless-stopped
    depends_on:
      paginas-migracao:
        condition: service_completed_successfully
    environment:
      <<: *banco
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # API de Conversões da Meta (Lead enviado também pelo servidor). Sem token, só o Pixel funciona.
      META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-1104861572184949}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
    # O Easypanel faz o proxy (Traefik) e o HTTPS: não publique portas no host.
    # Aponte o domínio no painel para o serviço "lp", porta 3000.
    expose:
      - "3000"
    volumes:
      - image-cache:/app/.next/cache
    networks:
      - default
      - supabase
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  image-cache:

networks:
  # Rede do Supabase no Easypanel (containers portal_atletas_supabase-*), onde está o Postgres (`db`).
  # Ela é criada pelo compose do Supabase; este projeto só se conecta a ela.
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-portal_atletas_supabase_default}
